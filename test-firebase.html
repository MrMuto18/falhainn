<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فلاحين - اختبار Firebase</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Tajawal',sans-serif; background:#f5f1e8; padding:30px 20px; }
        .container { max-width:700px; margin:0 auto; }
        h1 { font-size:28px; font-weight:900; color:#1e6b45; margin-bottom:6px; }
        p { color:#6c757d; margin-bottom:30px; }
        .card { background:white; border-radius:18px; padding:28px; margin-bottom:20px; box-shadow:0 4px 20px rgba(0,0,0,0.07); }
        .card h2 { font-size:18px; font-weight:800; margin-bottom:16px; color:#2c3e50; }
        .btn { padding:12px 24px; border:none; border-radius:10px; font-family:'Tajawal',sans-serif; font-size:15px; font-weight:700; cursor:pointer; transition:all 0.25s; margin-left:10px; margin-bottom:10px; }
        .btn-green { background:#2d8659; color:white; }
        .btn-blue { background:#0277bd; color:white; }
        .btn-orange { background:#e65100; color:white; }
        .btn:hover { opacity:0.9; transform:translateY(-2px); }
        .log { background:#1a1a2e; color:#00ff88; border-radius:10px; padding:18px; font-family:monospace; font-size:13px; line-height:1.8; max-height:300px; overflow-y:auto; margin-top:14px; }
        .log .error { color:#ff5252; }
        .log .info { color:#64b5f6; }
        .log .success { color:#69f0ae; }
        .status { display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:50px; font-size:14px; font-weight:700; margin-bottom:16px; }
        .status.ok { background:rgba(45,134,89,0.1); color:#1e6b45; }
        .status.err { background:rgba(231,76,60,0.1); color:#c62828; }
        .status.wait { background:rgba(255,152,0,0.1); color:#e65100; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔥 اختبار Firebase</h1>
    <p>اختبر الاتصال بقاعدة بيانات Firebase لمنصة فلاحين</p>

    <div class="card">
        <h2>الحالة</h2>
        <div id="statusBadge" class="status wait">⏳ في الانتظار</div>

        <button class="btn btn-green" onclick="testInit()">✅ Test Init</button>
        <button class="btn btn-blue" onclick="testWrite()">📝 Test Write</button>
        <button class="btn btn-orange" onclick="testRead()">📖 Test Read</button>

        <div class="log" id="log">// سجل العمليات سيظهر هنا...<br></div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyC-z9igQOo7PbKiTzhi2fIRrHHuUXhN6AU",
    authDomain: "fla7in.firebaseapp.com",
    projectId: "fla7in",
    storageBucket: "fla7in.firebasestorage.app",
    messagingSenderId: "463607450723",
    appId: "1:463607450723:web:04d95f04873d15634bfc56"
};

let db;
const logEl = document.getElementById('log');
const statusEl = document.getElementById('statusBadge');

function log(msg, type='') {
    const line = document.createElement('div');
    line.className = type;
    line.textContent = `[${new Date().toLocaleTimeString('ar')}] ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(text, type) {
    statusEl.textContent = text;
    statusEl.className = 'status ' + type;
}

function testInit() {
    log('🚀 تهيئة Firebase...', 'info');
    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
        log('✅ Firebase تم تهيئته بنجاح!', 'success');
        log(`📌 Project: ${firebaseConfig.projectId}`, 'info');
        setStatus('✅ متصل', 'ok');
    } catch(e) {
        log('❌ خطأ: ' + e.message, 'error');
        setStatus('❌ خطأ', 'err');
    }
}

async function testWrite() {
    if (!db) { log('⚠️ قم بتشغيل Test Init أولاً', 'error'); return; }
    log('📝 جاري كتابة بيانات تجريبية...', 'info');
    try {
        const ref = await db.collection('test_consultations').add({
            name: 'فلاح تجريبي',
            phone: '55000000',
            crop: 'olive',
            cropName: 'زيتون',
            region: 'تونس',
            area: 'small',
            water: 'drip',
            soil: 'mixed',
            salinity: 'low',
            period: 'flowering',
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            status: 'new',
            isTest: true
        });
        log(`✅ تمت الكتابة! ID: ${ref.id}`, 'success');
    } catch(e) {
        log('❌ فشل الكتابة: ' + e.message, 'error');
    }
}

async function testRead() {
    if (!db) { log('⚠️ قم بتشغيل Test Init أولاً', 'error'); return; }
    log('📖 جاري قراءة الاستشارات...', 'info');
    try {
        const snap = await db.collection('consultations').orderBy('createdAt','desc').limit(5).get();
        log(`✅ عدد الاستشارات: ${snap.size}`, 'success');
        snap.forEach((doc, i) => {
            const d = doc.data();
            log(`  ${i+1}. ${d.name} - ${d.cropName} - ${d.region}`, 'info');
        });
    } catch(e) {
        log('❌ فشل القراءة: ' + e.message, 'error');
    }
}

// Auto init
window.onload = testInit;
</script>
</body>
</html>
