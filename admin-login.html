<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فلاحين - تسجيل دخول الأدمن</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        :root {
            --primary: #2d8659;
            --primary-light: #4caf50;
            --primary-dark: #1e6b45;
            --beige: #f5f1e8;
            --text: #2c3e50;
            --text-light: #6c757d;
            --red: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #0d3d24 0%, var(--primary-dark) 40%, var(--primary) 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated background shapes */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.07;
            background: white;
        }
        body::before { width: 600px; height: 600px; top: -200px; right: -150px; }
        body::after  { width: 400px; height: 400px; bottom: -150px; left: -100px; }

        .floating-icons {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .fi {
            position: absolute;
            font-size: 28px;
            opacity: 0.1;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.1; }
            90%  { opacity: 0.1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Card */
        .login-card {
            background: white;
            border-radius: 28px;
            padding: 50px 44px 44px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.25);
            position: relative;
            z-index: 10;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .login-logo {
            text-align: center;
            margin-bottom: 36px;
        }
        .logo-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            font-size: 34px;
            margin: 0 auto 16px;
            box-shadow: 0 10px 30px rgba(45,134,89,0.4);
        }
        .logo-name {
            font-size: 30px;
            font-weight: 900;
            color: var(--primary-dark);
            letter-spacing: -1px;
        }
        .logo-sub {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 4px;
            font-weight: 500;
        }

        /* Admin badge */
        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(45,134,89,0.08);
            border: 1px solid rgba(45,134,89,0.2);
            color: var(--primary-dark);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 28px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .input-wrap {
            position: relative;
        }
        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 16px;
            pointer-events: none;
        }
        .form-input {
            width: 100%;
            padding: 14px 46px 14px 46px;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            color: var(--text);
            background: #fafafa;
            outline: none;
            transition: all 0.25s;
        }
        .form-input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(45,134,89,0.1);
        }
        .form-input.error {
            border-color: var(--red);
            box-shadow: 0 0 0 4px rgba(231,76,60,0.08);
        }
        .toggle-pass {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: color 0.2s;
        }
        .toggle-pass:hover { color: var(--primary); }

        /* Error message */
        .error-msg {
            background: rgba(231,76,60,0.07);
            border: 1px solid rgba(231,76,60,0.2);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--red);
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .error-msg.show { display: flex; }

        /* Submit */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: white;
            border: none;
            border-radius: 14px;
            font-family: 'Tajawal', sans-serif;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 25px rgba(45,134,89,0.35);
            margin-top: 8px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(45,134,89,0.45);
        }
        .login-btn:disabled {
            opacity: 0.75;
            cursor: not-allowed;
            transform: none;
        }
        .btn-spinner {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--primary); }
        .back-link i { margin-left: 4px; }
    </style>
</head>
<body>

<!-- Floating icons background -->
<div class="floating-icons" id="floatingIcons"></div>

<div class="login-card">
    <div class="login-logo">
        <img src="logo.png" alt="فلاحين" style="height: 80px; width: auto; margin-bottom: 16px;">
        <div class="logo-name">فلاحين</div>
        <div class="logo-sub">منصة استشارات زراعية ذكية</div>
    </div>

    <div style="text-align:center">
        <div class="admin-badge">
            <i class="fas fa-shield-alt"></i>
            لوحة تحكم الأدمن
        </div>
    </div>

    <div class="error-msg" id="errorMsg">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">خطأ في البريد أو كلمة المرور</span>
    </div>

    <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <div class="input-wrap">
            <i class="fas fa-envelope input-icon"></i>
            <input
                type="email"
                class="form-input"
                id="emailInput"
                placeholder="admin@fla7in.tn"
                autocomplete="email"
            >
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input
                type="password"
                class="form-input"
                id="passInput"
                placeholder="••••••••"
                autocomplete="current-password"
                onkeydown="if(event.key==='Enter') doLogin()"
            >
            <button class="toggle-pass" onclick="togglePass()" type="button" tabindex="-1">
                <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
        </div>
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">
        <i class="fas fa-sign-in-alt"></i>
        دخول
    </button>

    <a href="index.html" class="back-link">
        <i class="fas fa-arrow-right"></i>
        العودة للموقع الرئيسي
    </a>
</div>

<script>
// Firebase init
const firebaseConfig = {
    apiKey: "AIzaSyC-z9igQOo7PbKiTzhi2fIRrHHuUXhN6AU",
    authDomain: "fla7in.firebaseapp.com",
    projectId: "fla7in",
    storageBucket: "fla7in.firebasestorage.app",
    messagingSenderId: "463607450723",
    appId: "1:463607450723:web:04d95f04873d15634bfc56"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// Check if already logged in
auth.onAuthStateChanged(user => {
    if (user) {
        window.location.href = 'admin.html';
    }
});

// Floating icons
const icons = ['🌿','🍃','🌱','🌾','🫒','🍇','🍅','🌶️','🌸'];
const container = document.getElementById('floatingIcons');
for (let i = 0; i < 15; i++) {
    const el = document.createElement('div');
    el.className = 'fi';
    el.textContent = icons[Math.floor(Math.random() * icons.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.animationDuration = (10 + Math.random() * 15) + 's';
    el.style.animationDelay = (Math.random() * 15) + 's';
    el.style.fontSize = (20 + Math.random() * 20) + 'px';
    container.appendChild(el);
}

function togglePass() {
    const input = document.getElementById('passInput');
    const icon  = document.getElementById('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
    }
}

function showError(msg) {
    document.getElementById('errorText').textContent = msg;
    document.getElementById('errorMsg').classList.add('show');
    document.getElementById('emailInput').classList.add('error');
    document.getElementById('passInput').classList.add('error');
}

function hideError() {
    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('emailInput').classList.remove('error');
    document.getElementById('passInput').classList.remove('error');
}

async function doLogin() {
    const email = document.getElementById('emailInput').value.trim();
    const pass  = document.getElementById('passInput').value;
    hideError();

    if (!email) { showError('الرجاء إدخال البريد الإلكتروني'); return; }
    if (!pass)  { showError('الرجاء إدخال كلمة المرور'); return; }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="btn-spinner"></div> جاري التحقق...';

    try {
        await auth.signInWithEmailAndPassword(email, pass);
        // onAuthStateChanged will redirect
    } catch (err) {
        let msg = 'البريد أو كلمة المرور غير صحيحة';
        if (err.code === 'auth/too-many-requests') msg = 'محاولات كثيرة، حاول لاحقاً';
        if (err.code === 'auth/network-request-failed') msg = 'تحقق من الاتصال بالإنترنت';
        showError(msg);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
    }
}
</script>
</body>
</html>
